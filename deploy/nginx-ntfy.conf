# /etc/nginx/sites-available/ntfy — then:
#   sudo ln -s /etc/nginx/sites-available/ntfy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ntfy.example.com
server {
    listen 80;
    server_name ntfy.example.com;

    # Notification icon (NTFY_ICON=https://ntfy.example.com/icons/aqi.png), served straight from the repo.
    location /icons/ {
        alias /opt/aircast/deploy/icons/;
    }

    location / {
        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;
        # ntfy holds phone connections open; don't buffer or time them out quickly.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3m;
        proxy_send_timeout 3m;
        client_max_body_size 0;
    }
}
